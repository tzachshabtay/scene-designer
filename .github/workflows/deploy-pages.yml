name: Deploy Demos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build production demos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library packages
        run: npm run build:packages

      - name: Build top-down demo
        run: npm run build:pages --workspace scene-designer-top-down-demo

      - name: Build Breakout demo
        run: npm run build:pages --workspace scene-designer-breakout-demo

      - name: Prepare Pages artifact
        run: |
          mkdir -p dist/pages
          cp -R pages/. dist/pages/
          cp -R demos/top-down/dist dist/pages/top-down
          cp -R demos/breakout/dist dist/pages/breakout

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
